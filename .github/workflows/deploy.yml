name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
        env:
          NEWSLETTER_FORM_ACTION: ${{ vars.NEWSLETTER_FORM_ACTION }}

      - name: Add Talk2Ink annotation dataset from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/talk2ink-annotation
          gh release download talk2ink-annotation144-20261103 --repo tianchengliu18/tcliu.cc --pattern talk2ink_annotation144_data.zip --dir out/talk2ink-annotation
          unzip -q out/talk2ink-annotation/talk2ink_annotation144_data.zip -d out/talk2ink-annotation
          cp out/talk2ink-annotation/talk2ink_annotation144_data.zip out/talk2ink-annotation/talk2ink_annotation144.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
